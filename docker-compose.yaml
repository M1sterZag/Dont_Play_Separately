services:
  postgres-service:
    image: postgres:18.4-bookworm
    container_name: dps-postgres-service
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - dps_postgres_data:/var/lib/postgresql/
    restart: always

  migrate-service:
    image: migrate/migrate:v4.19.1
    container_name: dps-migrate-service
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: dps-postgres-port-forwarder
    command: tcp-listen:${POSTGRES_PORT},fork,reuseaddr tcp-connect:postgres-service:${POSTGRES_PORT}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    depends_on:
      - postgres-service
    restart: always

volumes:
  dps_postgres_data: