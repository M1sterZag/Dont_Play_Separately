        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_M1sterZag_Dont_Play_Separately_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_M1sterZag_Dont_Play_Separately_internal_core_transport_http_response.ErrorResponse'
      summary: Search platforms
      tags:
      - platforms
  /teams:
    get:
      description: Returns active teams with optional filtering by search query, game
        and platform.
      parameters:
      - description: Search by team title
        in: query
        name: q
        type: string
      - description: Filter by game ID
        in: query
        name: game_id
        type: integer
      - description: Filter by platform ID
        in: query
        name: platform_id
        type: integer
      - description: Page size (default 20)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_teams_transport_http.TeamDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_M1sterZag_Dont_Play_Separately_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_M1sterZag_Dont_Play_Separately_internal_core_transport_http_response.ErrorResponse'
      summary: List teams
      tags:
      - teams
    post:
      consumes:
      - application/json
      description: Creates a team for the authenticated user as its owner. The owner
